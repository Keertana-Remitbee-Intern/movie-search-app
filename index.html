<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

        <nav class="navbar">
            <a href="index.html" class="logo">CineFind</a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="#">Explore</a>
            </div>
        </nav>

        <div class="hero-content">
            <h1>Find Your Next Movie</h1>
            <p>
                Search, discover, and find something worth watching.
            </p>
            <section class="search-section">
                <form id="searchForm">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search for a movie..."
                        autocomplete="off"
                    >
                    <button type="submit">Search</button>
                </form>
                <p id="inputMessage" class="message"></p>
            </section>
        </div>
    </header>


    <main>
        <section id="statusSection">
            <p id="loadingMessage" class="status hidden">
                Loading movies...
            </p>
            <p id="errorMessage" class="status error hidden"></p>
            <p id="noResultsMessage" class="status hidden">
                No movies found. Try another search.
            </p>
        </section>

        <section class="results-section">
            <h2 id="resultsTitle" class="results-title hidden">
                Search Results
            </h2>
            <div
                id="movieContainer"
                class="movie-container">
            </div>

            <div id="pagination" class="pagination hidden">
                <button id="prevButton">Previous</button>
                <span id="pageNumber">Page 1</span>
                <button id="nextButton">Next</button>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
