<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFind - Movie Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">CineFind</a>

            <button id="backButton" class="back-button hidden" type="button">
                X
            </button>
        </nav>

        <div class="hero-content">
            <h1>Find Your Next Movie</h1>

            <p>
                Search thousands of movies and find something worth watching.
            </p>

            <section class="search-section">
                <form id="searchForm">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search for a movie..."
                        autocomplete="off"
                    >

                    <button type="submit">
                        Search
                    </button>

                    <button
                        type="button"
                        id="clearButton"
                        class="clear-button hidden"
                    >
                        X
                    </button>

                </form>

                <p id="inputMessage" class="message"></p>
            </section>
        </div>
    </header>

    <main>

        <!-- Search Status -->

        <section id="statusSection">

            <p id="loadingMessage" class="status hidden">
                Loading movies...
            </p>

            <p id="errorMessage" class="status error hidden"></p>

            <p id="noResultsMessage" class="status hidden">
                No movies found. Try another search.
            </p>

        </section>


        <!-- Search Results -->

        <section id="resultsSection" class="results-section">

            <h2 id="resultsTitle" class="results-title hidden">
                Search Results
            </h2>

            <div id="movieContainer" class="movie-container">
            </div>

            <div id="pagination" class="pagination hidden">

                <button id="prevButton" type="button">
                    Previous
                </button>

                <span id="pageNumber">
                    Page 1
                </span>

                <button id="nextButton" type="button">
                    Next
                </button>

            </div>

        </section>


        <section id="exploreSection" class="explore-section">

            <h2>Explore Movies</h2>

            <div id="genreFilter" class="genre-filter">

                <h3>Genre Selection</h3>

                <div class="genre-buttons">

                    <button type="button" class="genre-button active" data-genre="all">
                        All
                    </button>

                    <button type="button" class="genre-button" data-genre="28">
                        Action
                    </button>

                    <button type="button" class="genre-button" data-genre="878">
                        Sci-Fi
                    </button>

                    <button type="button" class="genre-button" data-genre="18">
                        Drama
                    </button>

                    <button type="button" class="genre-button" data-genre="27">
                        Horror
                    </button>

                    <button type="button" class="genre-button" data-genre="35">
                        Comedy
                    </button>

                </div>

            </div>

            <h3>Popular Movies</h3>

            <div id="popularContainer" class="movie-container">
            </div>

            <h3>Top Rated Movies</h3>

            <div id="topRatedContainer" class="movie-container">
            </div>

        </section>


        <!-- Movie Details -->

        <section id="movieDetails" class="movie-details hidden">

            <div class="details-container">

                <div class="details-poster-container">

                    <img
                        id="detailsPoster"
                        class="details-poster"
                        alt="Movie poster"
                    >

                </div>


                <div class="details-info">

                    <h1 id="detailsTitle"></h1>

                    <div class="details-meta">

                        <span id="detailsYear"></span>

                        <span id="detailsRuntime"></span>

                        <span id="detailsRating"></span>

                    </div>

                    <p id="detailsGenre" class="details-genre"></p>

                    <p id="detailsPlot" class="details-plot"></p>


                    <div class="details-item">
                        <strong>Director</strong>
                        <span id="detailsDirector"></span>
                    </div>

                    <div class="details-item">
                        <strong>Actors</strong>
                        <span id="detailsActors"></span>
                    </div>

                    <div class="details-item">
                        <strong>Released</strong>
                        <span id="detailsReleased"></span>
                    </div>

                    <div class="details-item">
                        <strong>Language</strong>
                        <span id="detailsLanguage"></span>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
